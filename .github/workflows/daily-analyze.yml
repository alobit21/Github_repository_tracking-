name: Continuous Analyze & Commit

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours (4 times daily)
    - cron: '0 2 * * *'     # Daily 02:00 UTC (main report)
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo WITH push permissions
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # 3️⃣ Clean npm environment (extra safe)
      - name: Reset npm config
        run: |
          rm -f ~/.npmrc
          npm config set registry https://registry.npmjs.org/

      # 4️⃣ Install dependencies (CI-safe)
      - name: Install Dependencies
        run: npm ci

      # 5️⃣ Configure Git
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 6️⃣ Provide token to your script
      - name: Set GitHub token for script
        run: echo "GITHUB_TOKEN=${{ secrets.PERSONAL_GITHUB_TOKEN }}" >> $GITHUB_ENV

      # 7️⃣ Run analyzer
      - name: Run Continuous Analyzer
        run: npx tsx src/scripts/analyze-trends.ts

      # 8️⃣ Always create commits with different changes
      - name: Create Multiple Commits
        run: |
          # Get current timestamp
          TIMESTAMP=$(date -u +'%Y-%m-%d_%H-%M')
          HOUR=$(date -u +'%H')
          
          echo "Creating 5 commits at $TIMESTAMP"
          
          # Commit 1: Update timestamp file
          echo "{\"last_run\": \"$TIMESTAMP\", \"hour\": $HOUR}" > data/last-run.json
          git add data/last-run.json
          git commit -m "chore: update last run timestamp - $TIMESTAMP"
          
          # Commit 2: Update analysis metadata
          echo "{\"analysis_time\": \"$TIMESTAMP\", \"repo_count\": 50, \"hour\": $HOUR}" > data/analysis-meta.json
          git add data/analysis-meta.json
          git commit -m "data: analysis metadata update - $TIMESTAMP"
          
          # Commit 3: Create activity log
          echo "{\"activity\": \"github_action_run\", \"timestamp\": \"$TIMESTAMP\", \"status\": \"success\"}" > data/activity-log.json
          git add data/activity-log.json
          git commit -m "log: activity recorded - $TIMESTAMP"
          
          # Commit 4: Update statistics
          echo "{\"total_runs\": $(($(date +%s) / 3600)), \"last_success\": \"$TIMESTAMP\"}" > data/stats.json
          git add data/stats.json
          git commit -m "stats: run statistics updated - $TIMESTAMP"
          
          # Commit 5: Commit the actual data changes (if any)
          git add data/daily-report.json data/history/ src/data/ || true
          if git diff --cached --quiet; then
            # No data changes, create a placeholder commit
            echo "{\"placeholder\": \"no_data_changes\", \"timestamp\": \"$TIMESTAMP\"}" > data/placeholder.json
            git add data/placeholder.json
            git commit -m "data: placeholder commit - $TIMESTAMP"
          else
            # Has data changes, commit them
            case $HOUR in
              02)
                COMMIT_MSG="data: daily main report - $(date -u +'%Y-%m-%d')"
                ;;
              06|12|18)
                COMMIT_MSG="data: 6-hourly update - $(date -u +'%Y-%m-%d %H:%M')"
                ;;
              *)
                COMMIT_MSG="data: 6-hourly update - $(date -u +'%Y-%m-%d %H:%M')"
                ;;
            esac
            git commit -m "$COMMIT_MSG"
          fi
          
          echo "✅ Created 5 commits successfully"
          
          # Push all commits
          git push origin HEAD:${{ github.ref_name }} --force-with-lease