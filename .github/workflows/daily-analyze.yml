name: Continuous Analyze & Commit

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours (4 times daily)
    - cron: '0 2 * * *'     # Daily 02:00 UTC (main report)
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo WITH push permissions
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # 3️⃣ Clean npm environment (extra safe)
      - name: Reset npm config
        run: |
          rm -f ~/.npmrc
          npm config set registry https://registry.npmjs.org/

      # 4️⃣ Install dependencies (CI-safe)
      - name: Install Dependencies
        run: npm ci

      # 5️⃣ Configure Git
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 6️⃣ Provide token to your script
      - name: Set GitHub token for script
        run: echo "GITHUB_TOKEN=${{ secrets.PERSONAL_GITHUB_TOKEN }}" >> $GITHUB_ENV

      # 7️⃣ Run analyzer
      - name: Run Continuous Analyzer
        run: npx tsx src/scripts/analyze-trends.ts

      # 8️⃣ Commit & push with timestamp
      - name: Commit & Push Changes
        run: |
          # Add all changes
          git add data/daily-report.json data/history/ src/data/ || true
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            # Get current timestamp and hour
            TIMESTAMP=$(date -u +'%Y-%m-%d_%H-%M')
            HOUR=$(date -u +'%H')
            
            # Create descriptive commit message based on hour
            case $HOUR in
              02)
                COMMIT_MSG="data: daily main report - $(date -u +'%Y-%m-%d')"
                ;;
              06|12|18)
                COMMIT_MSG="data: 6-hourly update - $(date -u +'%Y-%m-%d %H:%M')"
                ;;
              *)
                COMMIT_MSG="data: 6-hourly update - $(date -u +'%Y-%m-%d %H:%M')"
                ;;
            esac
            
            # Commit with timestamp
            git commit -m "$COMMIT_MSG"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit at $(date)"
          fi