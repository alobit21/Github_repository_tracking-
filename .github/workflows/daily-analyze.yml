name: Analyze Trends & Commit Data

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours (4 times daily)
    - cron: '0 2 * * *'     # Daily 02:00 UTC (main report)
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo WITH push permissions
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # 3️⃣ Clean npm environment (extra safe)
      - name: Reset npm config
        run: |
          rm -f ~/.npmrc
          npm config set registry https://registry.npmjs.org/

      # 4️⃣ Install dependencies (CI-safe)
      - name: Install Dependencies
        run: npm ci

      # 5️⃣ Configure Git
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 6️⃣ Run analyzer
      - name: Run Analyzer
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: npx tsx src/scripts/analyze-trends.ts

      # 7️⃣ Commit only if the analyzer produced real changes
      - name: Commit data changes
        run: |
          git add data/daily-report.json data/history/ src/data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes, nothing to commit"
          else
            git commit -m "data: trend update - $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push origin HEAD:${{ github.ref_name }}
          fi
