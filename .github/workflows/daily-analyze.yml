name: Daily Analyze & Commit

on:
  schedule:
    - cron: '0 2 * * *'   # daily 02:00 UTC
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo WITH push permissions
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # 3️⃣ Clean npm environment (extra safe)
      - name: Reset npm config
        run: |
          rm -f ~/.npmrc
          npm config set registry https://registry.npmjs.org/

      # 4️⃣ Install dependencies (CI-safe)
      - name: Install Dependencies
        run: npm ci

      # 5️⃣ Configure Git
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 6️⃣ Provide token to your script
      - name: Set GitHub token for script
        run: echo "GITHUB_TOKEN=${{ secrets.PERSONAL_GITHUB_TOKEN }}" >> $GITHUB_ENV

      # 7️⃣ Run analyzer
      - name: Run Daily Analyzer
        run: npx tsx scripts/analyze-trends.ts

      # 8️⃣ Commit & push ONLY if changes exist
      - name: Commit & Push
        run: |
          git add data/daily-report.json data/history/ || true
          git diff --cached --quiet || git commit -m "data: daily report $(date -u +'%Y-%m-%d')"
          git push origin HEAD:${{ github.ref_name }}